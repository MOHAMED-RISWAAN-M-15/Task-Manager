<!DOCTYPE html>
<html>
    <head>
        <title>TODO LIST </title>
        <link rel="stylesheet" href="todolist.css">
        <link rel="icon" type="image/jpeg" href="autum.jpeg">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
     </head>
    <body>
        <main class="main">
            <div class="container">

                
                <div class="header"> 
                        <h1>TO-DO <span id="h1-text">LIST</span></h1>
                        <p class="advice">Stay organized ,get things organized </small><br>
                </div>

                <div class="task-remainder">
                        <pre id="remainder-para"> 0 Task      |       0 Complete</pre>
                </div>

                <div class="task-input">
                        <input type="text" placeholder="ENTER A TASK" id="input-el">
                        <button id="add-btn"><big>+</big>  ADD Task</button>
                </div>
                
                <div class="Task">
                        <ul id="ul-el">
                        <pre id="ul-remender">Add   new    task  to  enter</pre>
                        </ul>
                    </div>
                    <p id="quots">Develop yourself </p>
                    
            </div>

            
            
        </main>
        
     
        
        
        <script src="todolist.js"></script>
        
    </body>
</html>
